<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My KeySpace - คลังเฉลยเอกสาร</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Supabase JS (แก้ไขลิงก์เรียบร้อย) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar / Header -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <span class="logo-icon">🔑</span>
        <span class="logo-text">My KeySpace</span>
      </div>

      <div class="nav-right">
        <span id="status-badge" class="badge-status">🔒 ยังไม่ได้เข้าสู่ระบบ</span>
        <div class="dropdown">
          <button class="menu-btn" onclick="toggleMenu()">☰</button>
          <div id="dropdown-menu" class="dropdown-content">
            <a href="#" onclick="showRules(); return false;">⚠️ กฎการใช้งาน</a>
            <a href="https://line.me" target="_blank">💬 ติดต่อแอดมิน</a>
            <a href="#" id="menu-logout" onclick="logout(); return false;" style="display: none; color: #d9534f;">🚪 ออกจากระบบ</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container">

    <!-- 1. หน้าต่างเข้าสู่ระบบ (Login Box) -->
    <div id="login-box" class="card-box">
      <h2>🔐 เข้าสู่ระบบ</h2>
      <p class="subtitle">กรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าชมคลังเฉลย</p>

      <div class="form-group">
        <label for="username">ชื่อผู้ใช้ (Username)</label>
        <input type="text" id="username" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="access-code">รหัสผ่าน (Password)</label>
        <input type="password" id="access-code">
      </div>

      <p id="error-msg" class="error-text" style="display: none;"></p>

      <button class="btn-primary" onclick="checkAccess()">เข้าสู่ระบบ</button>
    </div>

    <!-- 2. หน้าหลักคลังไฟล์ (Dashboard Box) -->
    <div id="dashboard-box" class="card-box" style="display: none;">
      <div class="dashboard-header">
        <div>
          <h2>📚 คลังเฉลยของคุณ <span id="user-display-name" class="user-highlight"></span></h2>
          <p class="subtitle">เลือกวิชาที่ต้องการเปิดอ่านได้เลยน้า</p>
        </div>
      </div>

      <!-- ช่องค้นหาไฟล์ -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" oninput="filterFiles()">
      </div>

      <!-- ตารางแสดงการ์ดไฟล์ -->
      <div id="file-grid" class="file-grid">
        <!-- Javascript จะดึงไฟล์มาแสดงตรงนี้ -->
      </div>
    </div>

    <!-- 3. หน้าเปิดอ่านเอกสาร PDF (Content Box) -->
    <div id="content-box" class="card-box" style="display: none;">
      <div class="content-header">
        <button class="btn-back" onclick="backToDashboard()">← กลับหน้าหลัก</button>
        <h2 id="pdf-title">ชื่อไฟล์เฉลย</h2>
      </div>

      <!-- คอนเทนเนอร์สำหรับวาด Canvas PDF -->
      <div id="pdf-container" class="pdf-container">
        <!-- PDF pages rendered here -->
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>

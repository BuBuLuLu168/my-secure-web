<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My KeySpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- แถบ Navbar สีครีมมินิมอล ชิดขอบบน -->
  <nav class="navbar">
    <div class="nav-brand" onclick="location.reload()">🔑 My KeySpace</div>
    
    <div class="nav-right">
      <span id="status-badge" class="badge-status">🔒 ยังไม่ได้เข้าสู่ระบบ</span>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>

    <!-- เมนูดรอปดาวน์ -->
    <div id="dropdown-menu" class="dropdown-menu">
      <a class="menu-item" onclick="showRules()">📢 กฎการใช้งาน</a>
      <a class="menu-item" href="https://line.me/ti/p/qdWRxhabzh" target="_blank">💬 ติดต่อแอดมิน</a>
      <a id="menu-logout" class="menu-item logout-item" style="display: none;" onclick="logout()">🚪 ออกจากระบบ</a>
    </div>
  </nav>

  <!-- พื้นที่เนื้อหาหลัก -->
  <div class="main-container">
    
    <!-- 1. หน้าเข้าสู่ระบบ -->
    <div id="login-box">
      <div class="icon-header">🔑</div>
      <h2>เข้าสู่ระบบ</h2>
      <p class="subtitle">กรอกชื่อและรหัสผ่านเพื่อเข้าใช้งานนะ</p>
      
      <input type="text" id="username" placeholder="ชื่อผู้ใช้งานของคุณ">
      <input type="password" id="access-code" placeholder="รหัสผ่าน">
      <button onclick="checkAccess()">เข้าสู่ระบบ ✨</button>
      
      <p id="error-msg" style="color: #e06d53; display: none; margin-top: 10px;">รหัสไม่ถูกต้องน้า ลองใหม่อีกที!</p>
    </div>

    <!-- 2. หน้าเลือกไฟล์ -->
    <div id="dashboard-box" style="display: none;">
      <div class="header-bar">
        <h1>📂 เลือกไฟล์ที่ต้องการอ่าน</h1>
        <p>ยินดีต้อนรับคุณ <span id="user-display-name" style="color:#a67c52;"></span> เลือกวิชาด้านล่างได้เลยจ้า</p>
      </div>

      <div id="file-grid" class="file-grid"></div>
    </div>

    <!-- 3. หน้าอ่านเนื้อหาไฟล์ PDF -->
    <div id="content-box" style="display: none;">
      <button class="btn-back" onclick="backToDashboard()">← กลับไปเลือกไฟล์อื่น</button>
      <div class="topic-card">
        <h2 id="pdf-title" style="color: #8c6d53; margin-bottom: 20px;">ชื่อไฟล์</h2>
        <div id="pdf-container" style="width: 100%; text-align: center; position: relative;"></div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
